services:
  - type: web
    name: ai-mystery-room-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_RECOVERY_MODELS
        value: gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-2.5-flash-lite
      - key: GEMINI_ATTEMPTS_PER_MODEL
        value: "2"
      - key: GEMINI_MAX_RECOVERY_MODELS
        value: "2"
      - key: GEMINI_RETRY_BASE_DELAY_MS
        value: "1000"
      - key: GEMINI_RETRY_MAX_BACKOFF_MS
        value: "4000"
      - key: GEMINI_RETRY_AFTER_LIMIT_MS
        value: "15000"
